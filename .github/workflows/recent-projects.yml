name: Atualizar Projetos Recentes

on:
  schedule:
    - cron: "0 0 * * *"  # executa todo dia à meia-noite UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://github.com/LaizVerlane"
          commit_message: "Atualiza lista de projetos recentes [Automático]"
